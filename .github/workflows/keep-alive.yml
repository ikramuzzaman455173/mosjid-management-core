name: Supabase Keep-Alive Cron

on:
  schedule:
    # Runs at 00:00 every 2 days
    - cron: "0 0 */2 * *"
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Error: SUPABASE_URL secret is not set."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "Error: SUPABASE_KEY secret is not set."
            exit 1
          fi

          SUPABASE_URL="${SUPABASE_URL//$'\r'/}"
          SUPABASE_URL="${SUPABASE_URL//$'\n'/}"
          SUPABASE_URL="${SUPABASE_URL%\"}"
          SUPABASE_URL="${SUPABASE_URL#\"}"
          SUPABASE_URL="${SUPABASE_URL%/}"
          SUPABASE_URL="${SUPABASE_URL%/rest/v1}"

          if [[ "$SUPABASE_URL" != http://* && "$SUPABASE_URL" != https://* ]]; then
            SUPABASE_URL="https://$SUPABASE_URL"
          fi

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Sending keep-alive request to Supabase directly..."

          RESPONSE=$(curl -s -w "\n%{http_code}" "$SUPABASE_URL/rest/v1/app_settings?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
            
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 204 ]; then
            echo "Failed with status $HTTP_STATUS"
            echo "Response: $RESPONSE"
            exit 1
          fi
          echo "Successfully pinged Supabase."
